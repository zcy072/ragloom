server {
    listen 80;
    # The backend accepts 50 MiB file content; leave room for multipart framing.
    client_max_body_size 52M;

    # 安全响应头：server 级 add_header 会被没有自己 add_header 的 location 继承，新增 location 时别单独加。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Uploads and index management can take longer than nginx's 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api/chat {
        proxy_pass http://backend:8000/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
