name: ragloom

# 容器标准输出日志按大小轮转，避免 json-file 日志无限增长。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
      args:
        DOCKER_LIBRARY_PREFIX: ${DOCKER_LIBRARY_PREFIX:-docker.m.daocloud.io/library}
        # 默认使用官方 PyPI；可在命令前覆盖 PIP_INDEX_URL 测试其他源。
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./storage:/app/storage
      - paddle_models:/home/app/.paddlex/official_models
    # .env 中的变量全部传给后端，没写的使用 backend/services/core/settings.py 中的默认值。
    # 下面 environment 中的值优先于 .env：路径和 Milvus 地址由容器布局决定，不应在 .env 中修改。
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HOME: /home/app
      STORAGE_DIR: /app/storage
      MINERU_RESULTS_DIR: /app/storage/mineru_results
      MILVUS_URI: http://milvus:19530
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      # 仅在后端只经 nginx 访问时安全；若把 8000 端口改为对外暴露，必须改成 false。
      AUTH_TRUST_X_REAL_IP: ${AUTH_TRUST_X_REAL_IP:-true}
    depends_on:
      milvus:
        condition: service_healthy
    healthcheck:
      # 镜像里没有 curl，用 Python 标准库探测。
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Linux 的 Docker 不自带 host.docker.internal；本地 Ollama/vLLM 默认地址依赖它。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 只绑定本机回环：前端通过容器网络访问后端，8000 仅供本机调试和冒烟测试，局域网不可达。
      - "127.0.0.1:8000:8000"
    restart: always
    logging: *default-logging

  # 单容器 Milvus Standalone（内嵌 etcd，本地存储），仅适合单机部署。
  milvus:
    # 固定 digest，镜像源换了内容也不会被静默拉取；升级时同时更新 tag 与 digest。
    image: ${MILVUS_IMAGE:-docker.1ms.run/milvusdb/milvus:v2.6.0@sha256:13bb2bff4b20598e860ee95ad1f42a167d20f50d9acc9718b09bf34792bb8f10}
    command: ["milvus", "run", "standalone"]
    environment:
      DEPLOY_MODE: STANDALONE
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: always
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        DOCKER_LIBRARY_PREFIX: ${DOCKER_LIBRARY_PREFIX:-docker.m.daocloud.io/library}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    ports:
      - "8080:80"  # 外部使用 8080 端口访问，避免与宿主机默认 80 端口冲突
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    logging: *default-logging

  frontend-check:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
      args:
        DOCKER_LIBRARY_PREFIX: ${DOCKER_LIBRARY_PREFIX:-docker.m.daocloud.io/library}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    # npm audit 固定用官方源：npmmirror 不提供审计接口。
    command:
      - sh
      - -c
      - npm run lint && npm run typecheck && npm run test:unit && npm run build && npm audit --registry=https://registry.npmjs.org

  backend-check:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: check
      args:
        DOCKER_LIBRARY_PREFIX: ${DOCKER_LIBRARY_PREFIX:-docker.m.daocloud.io/library}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    # 挂整个仓库：部署配置测试要读根目录的 docker-compose.yml、.env.example、docs/ 和 .github/。
    volumes:
      - .:/repo
    working_dir: /repo/backend
    environment:
      PYTHONPYCACHEPREFIX: /tmp/pymodel-pycache
      RUFF_CACHE_DIR: /tmp/ruff-cache
      UV_CACHE_DIR: /tmp/uv-cache
    command:
      - sh
      - -c
      - ruff check api.py app_storage.py routers services tests scripts evaluation && pyright && python -m compileall -q api.py app_storage.py routers services tests scripts evaluation

  e2e:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    ipc: host

volumes:
  milvus_data:
    name: ragloom_milvus_data
  paddle_models:
    name: pymodel_paddle_models
