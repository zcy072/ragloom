name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1 poppler-utils
      - name: Install dependencies
        run: |
          pip install --require-hashes --prefer-binary -r requirements.lock
          pip install --require-hashes --prefer-binary -r requirements-check.lock
      - name: Ruff
        run: ruff check api.py app_storage.py routers services tests scripts evaluation
      - name: Pyright
        run: pyright
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: OpenAPI snapshot
        run: python scripts/openapi_snapshot.py --check

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    # 与 frontend/Dockerfile.e2e 和 package-lock.json 中的 @playwright/test 版本保持一致。
    container: mcr.microsoft.com/playwright:v1.55.1-noble
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:e2e
